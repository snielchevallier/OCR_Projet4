<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tom troc</title>
        <!--fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

        <!--styles-->
        <link href="./dist/output.css" rel="stylesheet">
        
        <!--scripts-->
        <script src="./assets/js/scripts.js" defer></script>
    </head>
    <body class="bg-tomTroc-bg">
        <!--HEADER-->
        <header>
            <nav class="relative max-w-6xl mx-auto px-4 py-4 flex items-center">
                
                <img src="./assets/img/logo.svg" alt="Tom Troc" class="h-10">
                <button id="menu-btn" class="md:hidden ml-auto">
                    <img src="./assets/img/icon-menu.svg" alt="Menu" class="h-6">
                </button>
                <!-- Menu -->
                <ul id="menu"
                    class="hidden absolute top-16 left-0 w-full bg-white 
                        flex flex-col gap-4 p-6 text-sm font-inter
                        md:static md:flex md:flex-row md:items-center 
                        md:gap-8 md:p-0 md:bg-transparent 
                        md:flex-1 md:ml-8">

                    <li>
                        <a href="#" class="block py-2 font-semibold hover:text-tomTroc-green">Accueil</a>
                    </li>
                    <li>
                        <a href="#" class="block py-2 hover:text-tomTroc-green">Nos livres à l'échange</a>
                    </li>
                    <li class="md:ml-auto flex items-center gap-2">
                        <img src="./assets/img/icon-message.svg" alt="" class="h-5"> <a href="#" class="block py-2 hover:text-tomTroc-green">Messagerie <span class="bg-black text-white rounded-full text-xs px-1 py-1 mx-2">10</span></a>
                    </li>
                    <li class="flex items-center gap-2">
                        <img src="./assets/img/icon-account.svg" alt="" class="h-5"><a href="#" class="block py-2 hover:text-tomTroc-green">Mon compte</a>
                    </li>
                    <li>
                        <a href="#" class="block py-2 hover:text-tomTroc-green">Connexion</a>
                    </li>
                </ul>

            </nav>
        </header>
        <!--CONTENT-->
        <main>
            
            <!--BLOCK ACCOUNT-->
            <section class="bg-tomTroc-bg ">
                <div class="mx-auto pt-4 pb-0 max-w-6xl">
                    <a href="#" class="text-xs text-tomTroc-grey font-inter px-5 mb-6 md:mb-12 md:mt-4">
                        &larr; retour
                    </a>
                    <h2 class="text-3xl font-playfairDisplay px-5 mb-6 md:mb-12 md:mt-4">
                        Modifier les informations
                    </h2>
                </div>
                <div class="mx-auto pt-4 pb-0 px-5 max-w-6xl">
                    <div class="grid grid-cols-1 md:grid-cols-2 pb-10">
                         <div class="bg-white pt-6 px-5 flex flex-col items-center rounded-t-lg md:rounded-t-none md:rounded-l-lg md:ps-12 md:pe-18">
                            <p class="self-start block text-sm font-inter mb-2 text-tomTroc-grey">Photo</p>
                            <img src="assets/img/livre1.png" class="w-full aspect-square">
                            <label for="file-upload" class="self-end underline pt-2 pb-5 text-tomTroc-darkgrey text-sm font-inter cursor-pointer hover:underline">
                                modifier la photo
                            </label>
                            
                        </div>
                        <div class="bg-white rounded-b-lg md:rounded-b-none md:rounded-r-lg py-6 px-7">
                            <form method="POST" action="" class="space-y-6">
                                <input id="file-upload" type="file" class="hidden">
                                <div>
                                    <label for="titre" class="block text-sm font-inter mb-2 text-tomTroc-grey">
                                        Titre
                                    </label>
                                    <input 
                                        type="text"
                                        name="titre"
                                        id="titre"
                                        class="w-full px-4 py-3 text-sm border border-tomTroc-lightgrey rounded-lg bg-tomTroc-blue focus:outline-none focus:ring-2 focus:ring-tomTroc-green"
                                    >
                                </div>
                                <div>
                                    <label for="auteur" class="block text-sm font-inter mb-2 text-tomTroc-grey">
                                        Auteur
                                    </label>
                                    <input 
                                        type="text"
                                        name="auteur"
                                        id="auteur"
                                        class="w-full px-4 py-3 text-sm border border-tomTroc-lightgrey rounded-lg bg-tomTroc-blue focus:outline-none focus:ring-2 focus:ring-tomTroc-green"
                                    >
                                </div>
                                <div>
                                    <label for="Commentaire" class="block text-sm font-inter mb-2 text-tomTroc-grey">
                                        Commentaire
                                    </label>
                                    <textarea name="commentaire" id="commentaire" class="resize-none w-full h-80 px-4 py-3 text-sm border border-tomTroc-lightgrey rounded-lg bg-tomTroc-blue focus:outline-none focus:ring-2 focus:ring-tomTroc-green"></textarea>
                                </div>
                                <div>
                                    <label for="status" class="block text-sm font-inter mb-2 text-tomTroc-grey">
                                        Disponibilité
                                    </label>
                                    <select name="status" id="status" class="w-full px-4 py-3 text-sm border border-tomTroc-lightgrey rounded-lg bg-tomTroc-blue focus:outline-none focus:ring-2 focus:ring-tomTroc-green">
                                        <option value="">Disponible</option>
                                        <option value="">Indisponible</option>
                                    </select>
                                </div>
                                <button 
                                    type="submit"
                                    class="w-full md:w-80 bg-tomTroc-green text-white border-solid border-2 border-tomTroc-green font-inter font-semibold px-6 py-3 rounded-lg hover:bg-tomTroc-darkgreen hover:text-white transition"
                                >
                                    Valider
                                </button>
                            </form>
                        </div>
                    </div>
                </div>  
            </section>
        </main>
        <!--FOOTER-->
        <footer class="bg-white py-6 mt-0">
            <div class="max-w-6xl mx-auto px-4 ">
                <ul class="flex flex-col md:flex-row md:justify-end gap-4 md:gap-8 text-sm text-gray-600 items-center">
                    <li><a href="#" class="text-sm text-gray-600 hover:text-black">Politique de confidentialité</a></li>
                    <li><a href="#" class="text-sm text-gray-600 hover:text-black">Mentions légales</a></li>
                    <li>Tom Troc©</li>
                    <li><img src="./assets/img/logo-footer.svg" alt="Logo footer" class="w-6 h-6"></li>
                </ul>
            </div>
        </footer>
    </body>
</html>
